<details style="border: 1px solid #454ade; border-radius: 4px; padding: 10px; margin: 10px 0; box-shadow: 1px 2px 7px #f5f3a3;">
    <summary style="font-weight: normal; cursor: pointer; margin-bottom: 5px;">
        {{ .Get "title" | default "Click to expand" | markdownify }}
    </summary>
    <div style="margin-top: 10px;">
        {{ .Inner | markdownify }}
    </div>
</details>
